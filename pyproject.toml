[project]
name = "serveflow"
version = "0.1.0"
description = "ServeFlow — white-label agentic online ordering for restaurants & cafés"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.58.0",
    "python-fasthtml>=0.14.30",
    "python-multipart>=0.0.34",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
